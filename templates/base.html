<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: { colors: {
    primary:'#1a3a2a','primary-dark':'#122b1e','primary-light':'#28543e',
    ivory:'#f7f3ed','ivory-dark':'#ebe3d5',
    gold:'#c9a84c','gold-dark':'#a88938','gold-light':'#e5cb7a',
    charcoal:'#2c2c2a'
  }, fontFamily:{ serif:['Cormorant Garamond','serif'], sans:['Inter','sans-serif'] } } }
}
</script>
<style>
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .animate-fade-in{animation:fadeIn .3s ease-out forwards;}
</style>
</head>
<body class="{% block body_class %}bg-ivory{% endblock %} font-sans antialiased">
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
